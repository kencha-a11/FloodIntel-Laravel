# Render Blueprint for the FloodIntel Laravel API (Docker runtime).
#
# Supabase database setup (one-time, after the first deploy is created):
#   1. In Supabase: create the non-owner application role with a generated password:
#        create role app_runtime login password '<generated>'
#          nosuperuser nocreatedb nocreaterole nobypassrls;
#      The migration set grants it the tables and sequences it needs (D-61). If the
#      role is missing, the migration creates it as NOLOGIN and the app cannot
#      connect until a password is set.
#   2. In Supabase: Connect -> Postgres -> the session-mode pooler, copy the
#      app_runtime connection string. In Render: set DB_URL with that string and
#      mark it a Secret. The application always connects as app_runtime.
#      The string uses the pooler host on port 5432:
#        postgresql://app_runtime:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   3. In Render: set DB_OWNER_URL with the postgres owner connection string for the
#      SAME project and mark it a Secret. Only docker/entrypoint.sh reads it, to run
#      migrations; the running application never uses it. Owner connections bypass RLS
#      (D-08, D-61). Its shape:
#        postgresql://postgres:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#      Both strings must address the same project: the boot migrates the project
#      DB_OWNER_URL names, and the application reads the project DB_URL names.
#   Port 6543 is the transaction-mode pooler and is not usable here: it does not
#   support prepared statements, and the application does not emulate them
#   (config/database.php sets no options), so every query fails. The direct
#   connection (db.<ref>.supabase.co on 5432) is unusable for a different reason:
#   it needs IPv6, which Render containers do not have. The pooler host on 5432 is
#   IPv4 and needs nothing (D-143).
#   4. The migration set also creates app_maintenance (NOLOGIN, no credential) and
#      enables RLS on flood_reports, flood_impact_reports, flood_events, and
#      barangays (D-97, D-98). app_runtime is a member of app_maintenance only so
#      the address backfill can SET LOCAL ROLE; it is never the application's role.
#
# If you rename the service, update APP_URL and SANCTUM_STATEFUL_DOMAINS to match.

services:
  - type: web
    name: floodintel-laravel
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: FloodIntel
      - key: APP_KEY
        generateValue: true
      # The edge's own address ranges are not published by the host, so the
      # deployment trusts private address space only: the edge reaches the
      # container from inside the provider's network, and a request arriving
      # from a public address is never trusted, so a client-supplied
      # X-Forwarded-For cannot spoof the address the login limiter keys on.
      # A wildcard is never correct. If the deploy log shows a public source
      # address, replace this value with the address the log shows.
      - key: TRUSTED_PROXIES
        value: PRIVATE_SUBNETS
      - key: APP_URL
        value: https://floodintel-laravel.onrender.com
      - key: FRONTEND_URL
        value: https://floodintel-drrms.netlify.app
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_OWNER_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SANCTUM_STATEFUL_DOMAINS
        value: floodintel-laravel.onrender.com,floodintel-drrms.netlify.app
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_USERNAME
        value: abcfb2001@smtp-brevo.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: aljonkenfernandez36@gmail.com
      - key: MAIL_FROM_NAME
        value: FloodIntel
      # Supabase Realtime (DB-06, D-63, D-65). The URL and anon key are public
      # project settings; the service-role key and JWT secret are secrets with
      # an owner in OPS-09. When any of the four is missing the API reports
      # realtime as disabled and the client keeps polling.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEOCODER_USER_AGENT
        value: FloodIntel/1.0 (https://floodintel-drrms.netlify.app)
